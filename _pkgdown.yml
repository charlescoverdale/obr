url: https://charlescoverdale.github.io/obr/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/charlescoverdale/obr

articles:
  - title: Vignettes
    navbar: ~
    contents:
      - efo-forecasts
      - vintages
      - policy-measures
      - forecast-revisions

reference:
  - title: Public Finances Databank
    desc: Outturn data on borrowing, debt, receipts, and expenditure since 1946.
    contents:
      - get_public_finances
      - get_psnb
      - get_psnd
      - get_expenditure
      - get_receipts

  - title: Historical Official Forecasts
    desc: Every OBR forecast since 2010 for key fiscal and economic variables.
    contents:
      - list_forecast_series
      - get_forecasts
      - obr_forecast_panel
      - obr_compare_vintages
      - obr_actual_vs_forecast
      - get_forecast_revisions

  - title: Economic and Fiscal Outlook
    desc: Five-year projections from the latest Budget. The generic
      `get_efo_table()` plus catalogue exposes 35+ detailed-forecast tables;
      the headline wrappers below remain as convenience entry points.
    contents:
      - get_efo_table
      - obr_efo_catalogue
      - get_efo_fiscal
      - get_efo_economy
      - list_efo_economy_measures
      - get_monthly_profiles

  - title: Welfare Trends Report
    desc: Incapacity benefit spending and caseloads.
    contents:
      - get_welfare_spending
      - get_incapacity_spending
      - get_incapacity_caseloads

  - title: Policy Measures Database
    desc: Every UK fiscal-event-scored tax measure since 1970 and spending measure since 2010.
    contents:
      - get_policy_measures
      - policy_measures_summary

  - title: Fiscal rules
    desc: Charter for Budget Responsibility rule definitions and the
      stability-rule margin derived from the latest EFO.
    contents:
      - obr_fiscal_rules
      - obr_headroom

  - title: Vintage layer
    desc: Pin analyses to a specific OBR Economic and Fiscal Outlook for reproducibility.
    contents:
      - obr_efo_vintages
      - obr_as_of
      - obr_pin
      - obr_unpin
      - obr_pinned

  - title: Provenance
    desc: Inspect and manage the source metadata attached to every returned object.
    contents:
      - obr_provenance
      - print.obr_tbl
      - summary.obr_tbl
      - "`[.obr_tbl`"
      - as.data.frame.obr_tbl

  - title: Cache management
    desc: Manage locally cached OBR data files.
    contents:
      - clear_cache

  - title: Deprecated
    desc: >
      Retired functions kept as stubs for backward compatibility. Scheduled
      for removal in a future release.
    contents:
      - get_pension_projections

  - title: "Package"
    contents:
      - obr-package
